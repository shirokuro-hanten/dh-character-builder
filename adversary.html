<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダガーハート 敵キャラクター作成ツール</title>
  <link rel="icon" href="data/images/compatible_with_DH_logos-09.png" type="image/png">

  <link rel="stylesheet" href="data/css/adversary-style.css">
  <script src="data/js/adversary-script.js"></script>
</head>

<body>
<header>
  <h1>ダガーハート 敵キャラクター作成ツール</h1>
</header>

<main>
<!-- 保存・読み込み -->
  <div class="data-controls">
    <button type="button" id="new-adversary">
      新規作成
    </button>
    <button type="button" id="save-adversary" title="現在のデータをファイルとしてダウンロードします。">
      保存
    </button>
    <label for="load-adversary" class="button" title="ローカルファイルからデータを読み込みます。">
      読込
    </label>
    <input type="file" id="load-adversary" accept=".json,application/json" hidden>
  </div>

  <div class="data-controls">
    <button type="button" id="load-srd">
      SRDデータを適用
    </button>
    <select id="select-adversary-tier">
      <option value="" disabled selected>---ティアを選択---</option>
      <option value="1">ティア1</option>
      <option value="2">ティア2</option>
      <option value="3">ティア3</option>
      <option value="4">ティア4</option>
      <option value="1-2" disabled>【2.0】ティア1</option>
      <option value="2-2" disabled>【2.0】ティア2</option>
      <option value="3-2" disabled>【2.0】ティア3</option>
      <option value="4-2" disabled>【2.0】ティア4</option>
    </select>
    <select id="select-adversary">
      <option value="" disabled selected>------敵キャラクターを選択------</option>
    </select>
  </div>


  <section id="statblock">
    <section>
      <p>
        <input type="text" id="name" placeholder="名称" autocomplete="off">
      </p>

      <p>
        <input type="number" id="tier" min="1" max="4" placeholder="ティア">
        <select id="type">
          <option value="" selected disabled>種別</option>
          <option value="暴力">暴力</option>
          <option value="大群">大群</option>
          <option value="指揮">指揮</option>
          <option value="雑魚">雑魚</option>
          <option value="射撃">射撃</option>
          <option value="潜伏">潜伏</option>
          <option value="社交">社交</option>
          <option value="単体">単体</option>
          <option value="標準">標準</option>
          <option value="支援">支援</option>
        </select>
        <span id="show-hp-per-num" hidden>（
          <input type="number" id="hp-per-num">
          ／HP）
        </span>
      </p>
      <textarea id="description" rows="2" placeholder="説明"></textarea>
      <p>
        <label for="motives-and-tactics">動機と<br>戦術</label>
        <textarea id="motives-and-tactics" rows="2"></textarea>
      </p>
      <hr>

      <div id="stat-grid">
        <label for="difficulty">難易度</label>
        <input type="number" id="difficulty" value="10" min="1" max="30">
        
        <label for="damage-thresholds">ダメージ閾値</label>
        <input type="text" class="short" id="damage-thresholds" value="5／10">
        
        <label for="hp">HP</label>
        <input type="number" id="hp" value="3">

        <label for="stress">ストレス</label>
        <input type="number" id="stress" value="3">
        
        <label for="attack-modifier">攻撃修正値</label>
        <input type="text" class="short" id="attack-modifier" value="1">
        
        <label for="standard-attack">通常攻撃</label>
        <p>
          <input type="text" class="auto" id="standard-attack">
          <select id="standard-attack-range">
            <option value="" selected disabled>射程</option>
            <option value="近接">近接</option>
            <option value="至近距離">至近距離</option>
            <option value="近距離">近距離</option>
            <option value="遠距離">遠距離</option>
            <option value="超遠距離">超遠距離</option>
          </select>
          <br>
          <input type="text" class="short" id="standard-attack-damagedice" placeholder="ダメージ" value="1d6+1">
          <input type="text" class="short" id="standard-attack-damagetype" placeholder="種別" value="物理">
        </p>
      </div>
      <hr>

      <div id="experience-grid">
        <span class="grid-full">経験</span>
        <input type="text" class="auto" id="experiences-1">
        <input type="number" id="experiences-1-modifier">
        <input type="text" class="auto" id="experiences-2">
        <input type="number" id="experiences-2-modifier">
        <input type="text" class="auto" id="experiences-3">
        <input type="number" id="experiences-3-modifier">
        <input type="text" class="auto" id="experiences-4">
        <input type="number" id="experiences-4-modifier">
      </div>
    </section>

    <section id="feature-grid">
      <h4 class="grid-full">特徴</h4>
      <div>
        <p>
          <span class="label">#1</span>
          <input type="text" class="auto" id="feature-1" placeholder="特徴名">
          <select id="feature-1-type">
            <option value="" selected disabled>種類</option>
            <option value="受動">受動</option>
            <option value="行動">行動</option>
            <option value="反応">反応</option>
            <option value="プール">プール</option>
            <option value="進化">進化</option>
          </select>
          <textarea id="feature-1-description" rows="5" placeholder="説明"></textarea>
        </p>
        <p>
          <span class="label">#2</span>
          <input type="text" id="feature-2" placeholder="特徴名">
          <select id="feature-2-type">
            <option value="" selected disabled>種類</option>
            <option value="受動">受動</option>
            <option value="行動">行動</option>
            <option value="反応">反応</option>
            <option value="プール">プール</option>
            <option value="進化">進化</option>
          </select>
          <textarea id="feature-2-description" rows="5" placeholder="説明"></textarea>
        </p>
        <p>
          <span class="label">#3</span>
          <input type="text" id="feature-3" placeholder="特徴名">
          <select id="feature-3-type">
            <option value="" selected disabled>種類</option>
            <option value="受動">受動</option>
            <option value="行動">行動</option>
            <option value="反応">反応</option>
            <option value="プール">プール</option>
            <option value="進化">進化</option>
          </select>
          <textarea id="feature-3-description" rows="5" placeholder="説明"></textarea>
        </p>
        <p>
          <span class="label">#4</span>
          <input type="text" id="feature-4" placeholder="特徴名">
          <select id="feature-4-type">
            <option value="" selected disabled>種類</option>
            <option value="受動">受動</option>
            <option value="行動">行動</option>
            <option value="反応">反応</option>
            <option value="プール">プール</option>
            <option value="進化">進化</option>
          </select>
          <textarea id="feature-4-description" rows="5" placeholder="説明"></textarea>
        </p>
      </div>
      <div>
        <p>
          <span class="label">#5</span>
          <input type="text" id="feature-5" placeholder="特徴名">
          <select id="feature-5-type">
            <option value="" selected disabled>種類</option>
            <option value="受動">受動</option>
            <option value="行動">行動</option>
            <option value="反応">反応</option>
            <option value="プール">プール</option>
            <option value="進化">進化</option>
          </select>
          <textarea id="feature-5-description" rows="5" placeholder="説明"></textarea>
        </p>
        <p>
          <span class="label">#6</span>
          <input type="text" id="feature-6" placeholder="特徴名">
          <select id="feature-6-type">
            <option value="" selected disabled>種類</option>
            <option value="受動">受動</option>
            <option value="行動">行動</option>
            <option value="反応">反応</option>
            <option value="プール">プール</option>
            <option value="進化">進化</option>
          </select>
          <textarea id="feature-6-description" rows="5" placeholder="説明"></textarea>
        </p>
        <p>
          <span class="label">#7</span>
          <input type="text" id="feature-7" placeholder="特徴名">
          <select id="feature-7-type">
            <option value="" selected disabled>種類</option>
            <option value="受動">受動</option>
            <option value="行動">行動</option>
            <option value="反応">反応</option>
            <option value="プール">プール</option>
            <option value="進化">進化</option>
          </select>
          <textarea id="feature-7-description" rows="5" placeholder="説明"></textarea>
        </p>
        <p>
          <span class="label">#8</span>
          <input type="text" id="feature-8" placeholder="特徴名">
          <select id="feature-8-type">
            <option value="" selected disabled>種類</option>
            <option value="受動">受動</option>
            <option value="行動">行動</option>
            <option value="反応">反応</option>
            <option value="プール">プール</option>
            <option value="進化">進化</option>
          </select>
          <textarea id="feature-8-description" rows="5" placeholder="説明"></textarea>
        </p>
      </div>
    </section>
  </section>

  <h2 class="grid-full">オンセツール用コマ出力</h2>

  <div class="data-controls grid-full">
    <button type="button" id="export-ccfolia" title="ココフォリアのキャラクターとしてクリップボードにコピーします。ルームを開いて任意の場所に貼り付けてください。">ココフォリア</button>
    <button type="button" id="export-udonarium" title="ユドナリウムのキャラクターファイルとしてファイルをダウンロードします。ルームを開いてファイルをドラッグ＆ドロップしてください。">ユドナリウム</button>
  </div>
  
  <section id="export-data">
    <article id="additional-stats" class="export-block">
      <h3 class="grid-full">追加ステータス</h3>

      <div class="grid-full">
        <label for="number">数</label>
        <input type="number" id="number" value="1" min="1" max="20" title="2以上の場合、HP#1、ストレス#1、HP#2、ストレス#2…とステータスを複製します。">
      </div>

      <p>
        <input type="text" id="additional-stat-1">
        最大値<input type="number" id="additional-stat-1-max">
      </p>
      <p>
        <input type="text" id="additional-stat-2">
        最大値<input type="number" id="additional-stat-2-max">
      </p>
      <p>
        <input type="text" id="additional-stat-3">
        最大値<input type="number" id="additional-stat-3-max">
      </p>
      <p>
        <input type="text" id="additional-stat-4">
        最大値<input type="number" id="additional-stat-4-max">
      </p>
      <p>
        <input type="text" id="additional-stat-5">
        最大値<input type="number" id="additional-stat-5-max">
      </p>
    </article>
    
    <article class="export-block">
      <h3>追加チャットパレット</h3>
      <textarea id="additional-chat-palette" rows="8"></textarea>
    </article>
  </section>
</main>

</body>
</html>
